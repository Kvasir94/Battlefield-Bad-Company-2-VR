# as the "SPAS12 and Grenade" pickup, so this range needs PrepareLoadout (kit
# Weapons[] rewrite) or GiveWeapon (pickup re-point) to be admitted, and the
# SPAS12_sp asset must already be loaded in sp_02. route=menu: registry write of
# Client.Level at the main menu, then newSP.
