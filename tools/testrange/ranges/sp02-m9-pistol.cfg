# SP_02 test range config with M9 pistol (US_hg_M9-3) in Slot 1.
# The M9's SoldierWeaponData lives in the multiplayer common bundles, which
# SP_02 never mounts. TestRange.Mount adds them to SP_02's level bundle in
# memory, in the order MP levels list them; package.mft stays untouched.
# STATUS 2026-10-10: the level holds, the M9 is given, selected and its
# first-person mesh draws. See WEAPON-LOADING-AND-DEBUG-RECOVERY.md 1.6.
Client.Level Levels/SP_02
TestRange.Mount game:levels/sp_02/level-00.fbrb package:levels/mp2_common/level-00.fbrb
TestRange.Mount game:levels/sp_02/level-00.fbrb game:levels/mp_common/level-00.fbrb
# MP weapon materials (US_hg_M9Beretta/Shaders, ...) exist only in MP level
# shader databases; this 15 MB patch bundle carries one. The DLL keeps SP_02's
# own database last so its shaders win on shared names (TestRange.ShaderOrder).
TestRange.Mount game:levels/sp_02/level-00.fbrb package:levels/mp_009sdm/level-00.fbrb

# Fast start into campaign
TestRange.Start newSP
TestRange.Difficulty 1
TestRange.WaitFrames 60
TestRange.SkipCutscene 1
TestRange.SkipSeconds 60

# Developer / Debug levers (applied through SettingsManager):
Client.IsMenuDevOptsEnabled true
Client.DebugMenuOnLThumb true
Client.EnableRestTool true
Server.HasUnlimitedAmmo true

# Weapon loadout:
# Slot 0: Primary (XM8)
# Slot 1: Secondary (M9 Beretta)
Give.Slot0 SP_rgl_XM8_Scoped
Give.Slot1 US_hg_M9-3
Give.Select 1
# The M9 data comes from a mounted bundle and has no network id; without one
# the client drops the connection (reason 6) and the level exits to the menu.
TestRange.RegisterNetIds 1
