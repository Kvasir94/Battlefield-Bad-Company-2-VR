# SP_02 with the scoped XM8 in Primary1 and the SPAS-12 in Primary2, SPAS selected.
# Copy to <Bin>\BC2TestRange.cfg beside BC2TestRange.dll.
#
# Settings go through the engine registry (live-proven at about 3 s).
# Client.Level decides the level. Server.Level and Server.IsAIEnabled
# crashed the SP_02 load in testing; leave them out.
Client.Level Levels/SP_02
#
# Fast start: the DLL calls newSP itself on the UI thread once the main menu
# has run WaitFrames updates (live-proven), then restores the vtable slot.
TestRange.Start newSP
TestRange.Difficulty 1
TestRange.WaitFrames 60
# Skip the opening cutscene: after newSP the DLL calls skipCutscene (0x73fcd0)
# every 30 UI updates until the give has run or SkipSeconds pass; the engine
# ignores it until a skippable cutscene plays (SP_02's CS_11 is; Esc skips
# it by hand too). Live run ceb23b5: gameplay at about 28 s, no cutscene seen.
TestRange.SkipCutscene 1
TestRange.SkipSeconds 60
#
# Give.* keys never reach the registry. Once the local soldier has spawned,
# the DLL calls the engine's give/replace (0x6bcf80) on the game thread for
# each slot. Slots: 0 Primary1, 1 Primary2, 2 GL1, 3 GL2, 4 StaticGadget,
# 5 DynGadget1, 6 DynGadget2, 7 Melee, 8 HandGrenade. The value is the
# SoldierWeaponData Name (or WeaponAssetName, e.g. Objects/Weapons/Handheld/
# UL_shg_SPAS12/SP_shg_SPAS12, or its last path part); "none"
# removes the slot. Only weapons whose data the level already loaded can be
# given; others log "not loaded".
# SP_02 already starts with SP_rgl_XM8_Scoped in slot 0, so that give logs
# "already held" and is skipped rather than recreating the weapon.
Give.Slot0 SP_rgl_XM8_Scoped
Give.Slot1 SP_shg_SPAS12
# The slot to make active: it is given last, with selectNow set.
Give.Select 1
# Optional ammo overrides for every given weapon, applied like the pickup:
# reserve then loaded, only when Give.Loaded is set and not -1. Reserve is
# ignored natively for non-finite-ammo weapons (firing+0xa8 bit 8). The
# engine already fills ammo; leave these off unless needed.
#Give.Loaded 8
#Give.Reserve 32
