# SP_02 test range with every weapon: cycle the arsenal through Primary1/
# Primary2 with F7 (next) / F6 (previous), or from the headset (the VR mod
# signals Local\BC2TestRange.ArsenalNext/ArsenalPrev). Each step gives the next
# gun into the slot that is not selected and selects it, so the previous gun is
# one weapon switch away. See docs/WEAPON-VR-COVERAGE-20261010.md.
Client.Level Levels/SP_02
# Weapon data: MP common bundles, mp2 first so its patched copies win.
TestRange.Mount game:levels/sp_02/level-00.fbrb package:levels/mp2_common/level-00.fbrb
TestRange.Mount game:levels/sp_02/level-00.fbrb game:levels/mp_common/level-00.fbrb
# Vietnam weapons (and their knife/grenade/mine meshes) live in nam_common.
TestRange.Mount game:levels/sp_02/level-00.fbrb package:levels/nam_common/level-00.fbrb
# Shader databases for MP and Vietnam weapon materials; SP_02's own database
# stays last so its shaders win on shared names (TestRange.ShaderOrder).
TestRange.Mount game:levels/sp_02/level-00.fbrb package:levels/mp_009sdm/level-00.fbrb
TestRange.Mount game:levels/sp_02/level-00.fbrb package:levels/nam_mp_002sdm/level-00.fbrb
TestRange.RegisterNetIds 1

TestRange.Start newSP
TestRange.Difficulty 1
TestRange.WaitFrames 60
TestRange.SkipCutscene 1
TestRange.SkipSeconds 60

Client.IsMenuDevOptsEnabled true
Client.DebugMenuOnLThumb true
Server.HasUnlimitedAmmo true

# Every resident SoldierWeaponData except AI-only data, sorted by name.
Arsenal.All 1
Arsenal.Exclude AI_ Binoculars NAM_Handgrenade
# One representative of each supported gun before the remaining variants.
Arsenal.First UL_rif_HK416
Arsenal.First BU_lmg_MG36
Arsenal.First BU_sni_VSSVintores
Arsenal.First RU_rif_AKS74u
Arsenal.First BU_smg_IMIUZI
Arsenal.First XM8_sp_s
Arsenal.First SPAS12_sp
Arsenal.First F2000_sp
Arsenal.First AEK971_sp
Arsenal.First US_hg_M9-3
Arsenal.First US_rif_XM8c
Arsenal.First US_rif_XM8lmg
