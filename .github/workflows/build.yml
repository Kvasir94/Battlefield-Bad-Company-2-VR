name: Windows build and offline checks

# Runs once per PR and once per push to main. Docs-only changes skip CI.
'on':
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Windows ${{ matrix.architecture }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    defaults:
      run:
        shell: pwsh
    env:
      # Use embedded compiler debug info; no shared compiler PDB server needed.
      _CL_: /Z7
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Check offline Python tools and launcher behavior
        if: matrix.architecture == 'x64'
        run: |
          python -m pip install --disable-pip-version-check numpy==2.5.3 pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s .\tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tests\Test-PreviewLaunchers.ps1
      - name: Build and run deterministic C++ tests
        run: .\Build.ps1 -Architecture '${{ matrix.architecture }}' -Jobs 4
      - name: Check source export and packaged helper
        run: python -B .\tools\package_preview.py --root . --out .\dist\ci-source --version ci --source-only
      # No game, installed XR runtime, headset, hardware-GPU probe, release
      # archive upload or publication. Passing CI is not native/headset proof.

  linux:
    # Portable (non-Windows) C++ suites plus the Python suite. Windows-only
    # targets (D3D11, OpenXR, IPC, ModuleAbi, native probes) are not configured.
    name: Linux ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gcc
            build-type: RelWithDebInfo
            flags: ''
          - variant: gcc asan-ubsan
            build-type: Debug
            flags: -O1 -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
    env:
      CC: gcc
      CXX: g++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Configure portable C++ tests
        run: >
          cmake -S . -B build-linux
          -DCMAKE_BUILD_TYPE='${{ matrix.build-type }}'
          -DCMAKE_CXX_FLAGS='${{ matrix.flags }}'
          -DCMAKE_C_FLAGS='${{ matrix.flags }}'
          -DCMAKE_EXE_LINKER_FLAGS='${{ matrix.flags }}'
      - name: Build
        run: cmake --build build-linux --parallel 4
      - name: Run ctest
        run: ctest --test-dir build-linux --parallel 4 --output-on-failure
      - name: Run Python tests
        # The suite is sanitizer-independent; run it once.
        if: matrix.variant == 'gcc'
        run: |
          python -m pip install --disable-pip-version-check numpy==2.5.3 pillow==12.3.0
          python -B -m unittest discover -s tests -p 'test_*.py'
